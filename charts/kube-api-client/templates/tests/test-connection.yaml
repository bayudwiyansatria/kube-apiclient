apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kube-api-client.fullname" . }}-test-connection"
  labels:
    {{- include "kube-api-client.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: busybox
      image: bayudwiyansatria/busybox:latest
      command: ['wget']
      args: ['{{ include "kube-api-client.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
