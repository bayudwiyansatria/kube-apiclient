---
#-----------------------------------------------------------------------------------------------------------------------
# Server Config
#-----------------------------------------------------------------------------------------------------------------------
---
server:
  error:
    include-stacktrace: never
  port: ${SERVER_PORT:80}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
---
#-----------------------------------------------------------------------------------------------------------------------
# Spring Config
#-----------------------------------------------------------------------------------------------------------------------
---
spring:
  application:
    name: @project.artifactId@
    version: @project.version@
    api:
      url-pattern: ${API_URL_PATTERN:/api/*}
      auth-token:
        key: ${API_AUTH_TOKEN_HEADER:X-API-KEY}
        value: ${API_AUTH_TOKEN_VALUE:-}
    license:
      name: MIT
      url: https://opensource.org/licenses/MIT
  cloud:
    kubernetes:
      client:
        kube-config-file: ${KUBERNETES_CONFIG_FILE_PATH:/root/.kube/config}
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:-}
      username: ${MONGODB_USERNAME:-}
      password: ${MONGODB_PASSWORD:-}
      authentication-database: ${MONGODB_AUTHENTICATION_DATABASE:admin}
      ssl:
        enabled: ${MONGODB_SSL_ENABLED:false}
        bundle: ${MONGODB_SSL_BUNDLE:-}
      repositories:
        type: ${MONGODB_REPOSITORIES_TYPE:auto}
      auto-index-creation: ${MOGODB_AUTO_INDEX_CREATION:true}
      replica-set-name: ${MONGODB_REPLICA_SET_NAME:-}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MYSQL}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:-}
    password: ${DB_PASSWORD:-}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: off
  h2:
    console:
      enabled: true
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
  profiles:
    default: development
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 10MB
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: ${SWAGGER_PATH:/swagger}
  paths-to-exclude:
  - /v3/api-docs
  - /v3/api-docs/*
  - /swagger-ui/**
  - /swagger-ui
  - /actuator/**
  paths-to-match: ${spring.application.api.url-pattern}
---
#-----------------------------------------------------------------------------------------------------------------------
# Management Config
#-----------------------------------------------------------------------------------------------------------------------
---
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, loggers
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: ${MONGO_HEALTH_ENABLED:false}
---
#-----------------------------------------------------------------------------------------------------------------------
# Application Config
#-----------------------------------------------------------------------------------------------------------------------
---
logging:
  level:
    org:
      springframework: INFO
      hibernate:
        SQL: INFO
        orm: ERROR
      mongodb:
        driver: WARN
    com:
      bayudwiyansatria: INFO
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] --- [%thread] %logger{36} : %msg%n"
---
#-----------------------------------------------------------------------------------------------------------------------
# Override
#-----------------------------------------------------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: development
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    org:
      springframework: INFO
  file:
    name: ${logging.file.path}/spring.log
    path: ${LOG_PATH:./.data/logs}
---
spring:
  config:
    activate:
      on-profile: test
---
spring:
  config:
    activate:
      on-profile: staging
  h2:
    console:
      enabled: false
  security:
    user:
      name: ${SECURITY_USERNAME:-}
      password: ${SECURITY_PASSWORD:-}
logging:
  level:
    org:
      springframework: ERROR
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: production
  h2:
    console:
      enabled: false
  security:
    user:
      name: ${SECURITY_USERNAME:-}
      password: ${SECURITY_PASSWORD:-}
logging:
  level:
    org:
      springframework: ERROR
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
