  #   - build
  #   with:
  #     ARTIFACT_NAME: docs
  #     ARTIFACT_PATH: target/site/apidocs
  #     ARTIFACT_ROOT: target/site/apidocs
  #   secrets:
  #     GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
